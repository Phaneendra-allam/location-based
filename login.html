{% extends "base.html" %}
{% block header_class %}content-width-header{% endblock %}
{% block alerts_class %}content-width-header{% endblock %}
{% block content %}
    <section class="card" style="max-width: 760px; margin: 0 auto;">
        <div class="eyebrow">User Access</div>
        <h2>Sign in to the secure portal</h2>
        <p class="auth-copy">
            Enter your credentials to continue.
        </p>

        <form method="POST" class="form-grid">
            <div class="form-group full-width">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group full-width">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group full-width">
                <button type="submit" class="btn">Login</button>
            </div>
        </form>
    </section>
{% endblock %}
