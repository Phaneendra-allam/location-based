{% extends "base.html" %}
{% block header_class %}content-width-header{% endblock %}
{% block alerts_class %}content-width-header{% endblock %}
{% block content %}
    <section class="card" style="max-width: 760px; margin: 0 auto;">
        <div class="eyebrow">Enrollment</div>
        <h2>Create a secure user profile</h2>
        <p class="auth-copy">
            Fill in the details below to create your account.
        </p>

        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input id="confirm_password" type="password" name="confirm_password" placeholder="Re-enter password" required>
            </div>
            <div class="form-group">
                <label for="user_role">Role</label>
                <select id="user_role" name="user_role" required>
                    <option value="" disabled selected>Select role</option>
                    <option value="admin">Admin</option>
                    <option value="manager">Manager</option>
                    <option value="employee">Employee</option>
                </select>
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="" disabled selected>Select department</option>
                    <option value="Finance">Finance</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Operations">Operations</option>
                </select>
            </div>
            <div class="form-group full-width">
                <label for="years_of_service">Years of Service</label>
                <input id="years_of_service" type="number" step="0.1" name="years_of_service" placeholder="Enter years of service" required>
            </div>
            <div class="form-group full-width">
                <button type="submit" class="btn">Create Account</button>
            </div>
        </form>
    </section>
{% endblock %}
